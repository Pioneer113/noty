name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          # the page inlines its images, but crawlers fetch these by URL
          cp site/og.png site/apple-touch-icon.png site/favicon-32.png \
             site/icon-512.png site/icon.png _site/
          sed 's|noty-sepia.vercel.app|aimen08.github.io/noty|g' site/robots.txt  > _site/robots.txt
          sed 's|noty-sepia.vercel.app|aimen08.github.io/noty|g' site/sitemap.xml > _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
